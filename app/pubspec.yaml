name: travel_memory_book
description: Travel Memory Book — A personal travel journal that turns trips into digital photo books.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^15.1.2

  # Image handling
  image_picker: ^1.1.2
  image: ^4.3.0
  exif: ^3.3.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

  # Page flip + Audio
  book_page_flip: ^0.1.0
  audioplayers: ^6.1.0

  # UI
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-regular.ttf
          weight: 400
        - asset: assets/fonts/inter-medium.ttf
          weight: 500
        - asset: assets/fonts/inter-semibold.ttf
          weight: 600
        - asset: assets/fonts/inter-bold.ttf
          weight: 700
    - family: Syne
      fonts:
        - asset: assets/fonts/syne-semibold.ttf
          weight: 600
        - asset: assets/fonts/syne-bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/playfair-regular.ttf
          weight: 400
        - asset: assets/fonts/playfair-medium.ttf
          weight: 500
        - asset: assets/fonts/playfair-semibold.ttf
          weight: 600
        - asset: assets/fonts/playfair-bold.ttf
          weight: 700
        - asset: assets/fonts/playfair-italic.ttf
          weight: 500
          style: italic
    - family: Merriweather
      fonts:
        - asset: assets/fonts/merriweather-regular.ttf
          weight: 400
        - asset: assets/fonts/merriweather-bold.ttf
          weight: 700
        - asset: assets/fonts/merriweather-italic.ttf
          weight: 400
          style: italic
  assets:
    - assets/images/
    - assets/images/book/
    - assets/audio/
    - assets/illustrations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "../store-metadata/icon/icon-512.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "../store-metadata/icon/icon-512.png"
    background_color: "#ffffff"
    theme_color: "#3B82F6"
  windows:
    generate: true
    image_path: "../store-metadata/icon/icon-512.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "../store-metadata/icon/icon-512.png"

