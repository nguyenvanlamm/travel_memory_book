name: travel_memory_book
description: Travel Memory Book — A personal travel journal that turns trips into digital photo books.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^15.1.2

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # Image handling
  image_picker: ^1.1.2
  image: ^4.3.0
  exif: ^3.3.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  permission_handler: ^12.0.3

  # In-App Purchase
  in_app_purchase: ^3.1.13

  # Page flip + Audio
  book_page_flip: ^0.1.0
  audioplayers: ^6.1.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/book/
    - assets/audio/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "../store-metadata/icon/icon-512.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "../store-metadata/icon/icon-512.png"
    background_color: "#ffffff"
    theme_color: "#3B82F6"
  windows:
    generate: true
    image_path: "../store-metadata/icon/icon-512.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "../store-metadata/icon/icon-512.png"

