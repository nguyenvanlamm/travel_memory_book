[build]
  # app/build/web đã được build local và commit vào repo —
  # Netlify chỉ serve thư mục này, không cần build command.
  publish = "app/build/web"
  command = ""

# SPA fallback — Flutter dùng hash routing nên không bắt buộc,
# nhưng giữ cho an toàn nếu sau này đổi sang path routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
