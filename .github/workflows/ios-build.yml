name: iOS Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - appstore
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        type: string
      build_number:
        description: 'Build number'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    
    env:
      FLUTTER_VERSION: '3.24.0'
      JAVA_VERSION: '17'
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      
      - name: Install fastlane
        run: |
          sudo gem install fastlane -N
          fastlane --version
      
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -N
          pod --version
      
      - name: Get Flutter dependencies
        working-directory: ./app
        run: flutter pub get
      
      - name: Generate iOS icons
        working-directory: ./app
        run: flutter pub run flutter_launcher_icons
      
      - name: Install CocoaPods dependencies
        working-directory: ./app/ios
        run: pod install --repo-update
      
      - name: Configure fastlane environment
        run: |
          echo "TEAM_ID=${{ secrets.TEAM_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_PATH=./fastlane/authkey.p8" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_KEY_ID=${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" >> $GITHUB_ENV
          echo "APP_STORE_CONNECT_API_ISSUER_ID=${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" >> $GITHUB_ENV
          echo "MATCH_PASSWORD=${{ secrets.MATCH_PASSWORD }}" >> $GITHUB_ENV
          echo "MATCH_GIT_URL=${{ secrets.MATCH_GIT_URL }}" >> $GITHUB_ENV
        working-directory: ./app/ios
      
      - name: Setup App Store Connect API Key
        if: env.APP_STORE_CONNECT_API_KEY_ID != ''
        run: |
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" | base64 -d > ./fastlane/authkey.p8
          chmod 600 ./fastlane/authkey.p8
        working-directory: ./app/ios
      
      - name: Setup Match certificates
        if: env.MATCH_GIT_URL != ''
        run: |
          fastlane match appstore --readonly
        working-directory: ./app/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      
      - name: Build iOS
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            --build-name=${{ github.event.inputs.version || github.ref_name }} \
            --build-number=${{ github.event.inputs.build_number || github.run_number }}
        working-directory: ./app
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TravelMemoryBook-iOS
          path: app/build/ios/*.ipa
          retention-days: 30
      
      - name: Deploy to TestFlight
        if: github.event.inputs.environment == 'testflight' || github.event_name == 'push'
        run: |
          fastlane pilot upload \
            --api_key_path ./fastlane/authkey.p8 \
            --skip_waiting_for_build_processing \
            --distribute_external false \
            --changelog "Build ${{ github.run_number }} from ${{ github.sha }}"
        working-directory: ./app/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      
      - name: Deploy to App Store
        if: github.event.inputs.environment == 'appstore'
        run: |
          fastlane deliver \
            --api_key_path ./fastlane/authkey.p8 \
            --submit_for_review false \
            --automatic_release false \
            --force
        working-directory: ./app/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/ios/*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Run Tests
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Get Flutter dependencies
        working-directory: ./app
        run: flutter pub get
      
      - name: Run Flutter tests
        working-directory: ./app
        run: flutter test --coverage
      
      - name: Run iOS unit tests
        working-directory: ./app/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -quiet